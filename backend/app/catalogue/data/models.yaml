- id: trocr-ocr-manuscrit
  nom: TrOCR — reconnaissance d'écriture manuscrite
  famille: ocr
  secteur: Archivage / numérisation de documents manuscrits
  moteur: transformers
  moteur_ref: microsoft/trocr-small-handwritten
  taille: 62 millions de paramètres
  description_pedagogique: >-
    Contrairement à Tesseract (moteur classique conçu pour le texte imprimé, déjà présent dans
    le catalogue), TrOCR est un vrai transformer encodeur-décodeur, entraîné spécifiquement sur
    de l'écriture manuscrite — un problème nettement plus difficile car chaque main écrit
    différemment. L'exemple ci-dessous est une vraie ligne scannée de la base IAM Handwriting
    Database (anglais — aucun modèle léger fiable équivalent n'existe en français à ce jour).
  cas_usage:
    enonce: "Retranscrire une ligne d'écriture manuscrite scannée."
    exemples: []
    idees_usage:
    - "Numériser des archives manuscrites (courriers, registres) en texte recherchable."
    - "Retranscrire des notes prises à la main lors d'une réunion ou d'un cours."
    - "Extraire le texte de formulaires papier remplis à la main avant saisie informatique."
    - "Comparer la fiabilité de TrOCR (manuscrit) et Tesseract (imprimé) sur un même type de document mixte."
    - "Faciliter l'archivage de correspondances manuscrites anciennes pour un projet de recherche historique."
  statut: disponible
  lien_telechargement: https://huggingface.co/microsoft/trocr-small-handwritten
  mode_emploi: "pip install transformers torch Pillow, puis TrOCRProcessor.from_pretrained(\"microsoft/trocr-small-handwritten\") + VisionEncoderDecoderModel.from_pretrained(\"microsoft/trocr-small-handwritten\")."
