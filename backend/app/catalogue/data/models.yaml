- id: sd-turbo-generation-image
  nom: SD-Turbo — génération d'image
  famille: generation_image
  secteur: Création de contenu visuel
  moteur: diffusers
  moteur_ref: stabilityai/sd-turbo
  taille: 0,9 milliard de paramètres (~3,4 Go)
  description_pedagogique: >-
    Contrairement à tous les autres modèles du catalogue, qui COMPRENNENT du contenu existant
    (classer, extraire, transcrire...), celui-ci en GÉNÈRE de nouveau à partir d'une simple
    description en texte. Un Stable Diffusion classique a besoin d'une cinquantaine d'étapes de
    débruitage pour produire une image, ce qui le rend beaucoup trop lent sur CPU pour une démo
    interactive (plusieurs minutes). SD-Turbo est distillé pour ne nécessiter qu'UNE seule étape
    — le compromis qui rend la génération d'image possible ici en quelques secondes, au prix d'un
    rendu moins raffiné qu'un modèle complet sur GPU. C'est aussi, de loin, le modèle le plus
    lourd du catalogue (~3,4 Go) : une exception assumée à la règle des modèles légers, parce que
    la génération d'image n'a pas d'équivalent réellement plus petit et fiable.
  cas_usage:
    enonce: "Générer une image à partir d'une description en texte."
    exemples:
    - label: "Paysage"
      input: "Un phare sur une falaise face à l'océan au coucher du soleil, style peinture à l'huile."
    - label: "Objet"
      input: "Une tasse de café fumante posée sur un bureau en bois, lumière du matin."
    - label: "Scène urbaine"
      input: "Une rue pavée européenne sous la pluie, la nuit, avec des reflets de néons colorés."
    idees_usage:
    - "Générer un premier visuel d'illustration pour un article de blog, à affiner ensuite."
    - "Explorer rapidement plusieurs pistes visuelles pour un moodboard créatif."
    - "Créer une image de fond personnalisée pour une présentation, sans banque d'images payante."
    - "Prototyper visuellement un concept avant de le confier à un illustrateur professionnel."
    - "Illustrer un module pédagogique par une image générée plutôt qu'une photo de stock générique."
  statut: disponible
  lien_telechargement: https://huggingface.co/stabilityai/sd-turbo
  mode_emploi: "pip install diffusers torch, puis AutoPipelineForText2Image.from_pretrained(\"stabilityai/sd-turbo\") et appeler pipe(prompt=texte, num_inference_steps=1, guidance_scale=0.0)."
- id: roberta-detection-texte-ia
