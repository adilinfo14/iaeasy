  secteur: Vérification de contenu / esprit critique
  moteur: transformers
  moteur_ref: openai-community/roberta-base-openai-detector
  taille: 125 millions de paramètres
  description_pedagogique: >-
    Le détecteur officiel publié par OpenAI en 2019 pour repérer les textes générés par GPT-2 —
    l'un des tout premiers modèles de ce type. Utile pour illustrer concrètement l'idée, déjà
    posée sur la page d'accueil de ce site, que garder un esprit critique face à un texte suppose
    de pouvoir en interroger l'origine. Limite importante à connaître : entraîné sur GPT-2
    (2019), sa fiabilité sur les textes des modèles actuels (bien plus sophistiqués) n'est pas
    garantie — un score de détection n'est jamais une preuve, seulement un indice.
