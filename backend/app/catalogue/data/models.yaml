      input: "In conclusion, artificial intelligence offers numerous benefits across various industries, including healthcare, finance, and education, while also presenting certain challenges that must be carefully addressed."
    idees_usage:
    - "Donner un premier indice avant une vérification humaine plus approfondie, jamais une décision automatique seule."
    - "Sensibiliser en formation aux limites réelles de la détection de texte généré par IA."
    - "Comparer le score de plusieurs textes pour repérer ceux qui méritent une relecture attentive."
    - "Illustrer concrètement pourquoi la vigilance humaine reste nécessaire face à un contenu écrit."
    - "Servir de point de départ pédagogique avant de tester un détecteur plus récent sur les mêmes textes."
  statut: disponible
  lien_telechargement: https://huggingface.co/openai-community/roberta-base-openai-detector
  mode_emploi: "pip install transformers torch, puis pipeline(\"text-classification\", model=\"openai-community/roberta-base-openai-detector\")."
